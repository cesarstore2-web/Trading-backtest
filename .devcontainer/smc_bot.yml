name: SMC Automated Trading Bot

on:
  schedule:
    # يعمل تلقائياً كل 5 دقائق على مدار الساعة
    - cron: '*/5 * * * *'
  # يتيح لك تشغيل البوت يدوياً بضغطة زر من تبويب Actions
  workflow_dispatch:

jobs:
  run-smc-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute SMC Strategy Scanner
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          HTF: "1h"
          LTF: "5m"
          RR_RATIO: "2.0"
          RISK_PERCENT: "1.0"
          START_HOUR: "7"
          END_HOUR: "21"
          USE_TESTNET: "True"
        run: python runner.py
